[package]
name = "rx-rt"
version = "0.1.0"
edition = "2024"
description = "Startup code, vector tables and linker script for Renesas RX"
links = "rx-rt"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CDEF-inc/rx-rust"

[lib]
test = false
bench = false

[dependencies]
critical-section = { version = "1.2", optional = true, features = ["restore-state-bool"] }

[features]
# Save the DSP accumulator(s) in interrupt entries (compiled code does not use
# them; inline assembly might).
save-acc = []
# A critical-section implementation (PSW.I saved, cleared and restored), for
# crates such as PACs and embedded-hal-bus on a single core.
critical-section = ["dep:critical-section"]
