[package]
name = "rx74-hal"
version = "0.1.0"
edition = "2024"
description = "embedded-hal 1.0 implementation for the Renesas RX74M and RX74N"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CDEF-inc/rx-rust"

[lib]
test = false
bench = false

[dependencies]
rx74-pac = { path = "../rx74-pac", features = ["critical-section"] }
critical-section = "1.2"
# From crates.io, so that the HAL's types implement the same traits as the
# ones drivers and embedded-hal-bus use.
embedded-hal = "1.0"
embedded-io = "0.7"
embassy-time-driver = { version = "0.2", optional = true }
embassy-time-queue-utils = { version = "0.3", optional = true }
embedded-io-async = { version = "0.7", optional = true }

[features]
# The chip: exactly one of these (it picks rx74-pac's register description).
rx74m = ["rx74-pac/rx74m"]
rx74n = ["rx74-pac/rx74n"]
# hal::time: the embassy-time driver on CMTW0 / CMTW1.
embassy-time-driver = ["dep:embassy-time-driver", "dep:embassy-time-queue-utils"]
# Interrupt-driven drivers with embedded-io-async: serial::AsyncSerial.
async = ["dep:embedded-io-async"]
