[package]
name = "rx74-pac"
version = "0.1.0"
edition = "2021"
description = "Peripheral access crate for the Renesas RX74M and RX74N, generated at build time from e2 studio's RX74M.sfrx / RX74N.sfrx"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CDEF-inc/rx-rust"
build = "build.rs"

[lib]
test = false
bench = false

[dependencies]
vcell = "0.1.3"
critical-section = { version = "1.2", optional = true }

[features]
# Peripherals::take(); the application supplies the implementation (rx-rt's
# critical-section feature).
critical-section = ["dep:critical-section"]
# The chip: exactly one of these (build.rs reads its sfrx file).
rx74m = []
rx74n = []

[build-dependencies]
sfrx-pac = { path = "../sfrx-pac" }
