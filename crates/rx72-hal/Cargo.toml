[package]
name = "rx72-hal"
version = "0.1.0"
edition = "2024"
description = "embedded-hal 1.0 implementation for the Renesas RX72M and RX72N"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CDEF-inc/rx-rust"

[lib]
test = false
bench = false

[dependencies]
rx72-pac = { path = "../rx72-pac", features = ["critical-section"] }
critical-section = "1.2"
# CDEF-inc's fork of rust-embedded/embedded-hal (the same as upstream 1.0).
embedded-hal = { git = "https://github.com/CDEF-inc/embedded-hal", rev = "41f29f6bfced1cae0cbe712ba96ee32c075b3125" }
embedded-io = { git = "https://github.com/CDEF-inc/embedded-hal", rev = "41f29f6bfced1cae0cbe712ba96ee32c075b3125" }

[features]
# The chip: exactly one of these (it picks rx72-pac's register description).
rx72m = ["rx72-pac/rx72m"]
rx72n = ["rx72-pac/rx72n"]
