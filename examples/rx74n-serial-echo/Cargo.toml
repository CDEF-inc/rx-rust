[package]
name = "rx74n-serial-echo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rx-rt = { path = "../../crates/rx-rt", features = ["critical-section"] }
rx74-hal = { path = "../../crates/rx74-hal", features = ["rx74n"] }
embedded-io = { git = "https://github.com/CDEF-inc/embedded-hal", rev = "41f29f6bfced1cae0cbe712ba96ee32c075b3125" }

[[bin]]
name = "rx74n-serial-echo"
test = false
bench = false

[profile.release]
opt-level = "s"
debug = true

[profile.dev]
opt-level = 1

# The generated PAC is about 47 MB of source: with debug info rustc takes
# over ten minutes on it, without it about half a minute.
[profile.release.package.rx74-pac]
debug = false

[profile.dev.package.rx74-pac]
debug = false
opt-level = "s"
