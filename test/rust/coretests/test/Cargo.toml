[package]
name = "rx-test-shim"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "test"

[dependencies]
std = { package = "rx-std-shim", path = "../std" }
critical-section = { version = "1.2", optional = true }
rx74n-hal = { path = "../../../../crates/rx74n-hal", optional = true }

[features]
# On the RX74N board: PLL1 at 480 MHz before the tests, the end at _done.
rx74n = ["dep:rx74n-hal", "dep:critical-section"]
