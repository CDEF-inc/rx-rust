# Runs library/coretests (the tests of `core`) on QEMU. libtest and std do
# not build for rx-none-elf, so `std` and `test` are small stand-ins (std/,
# test/): see test/src/lib.rs. scripts/run-coretests.sh builds and runs it.
[package]
name = "coretests-rx"
version = "0.0.0"
edition = "2024"
publish = false
autotests = false
autobenches = false

[[test]]
name = "coretests"
path = "../../../rust/library/coretests/tests/lib.rs"

[dev-dependencies]
rand = { version = "0.9.0", default-features = false }
rand_xorshift = { version = "0.4.0", default-features = false }
std = { package = "rx-std-shim", path = "std" }
test = { package = "rx-test-shim", path = "test" }

[profile.dev]
opt-level = 1

# As in library/coretests/Cargo.toml.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_has_reliable_f16)',
    'cfg(target_has_reliable_f16_math)',
    'cfg(target_has_reliable_f128)',
    'cfg(target_has_reliable_f128_math)',
]
