[build]
target = "rx-none-elf"

[target.rx-none-elf]
# RXv3 with the FPU and the DFPU (the RX72M; the RX74N / RX74M run it too).
# scripts/hw-build.sh gives its own RUSTFLAGS: rxv3e for the RX74N / RX74M.
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "target-cpu=rxv3"]

[unstable]
build-std = ["core"]
build-std-features = ["compiler-builtins-mem"]
