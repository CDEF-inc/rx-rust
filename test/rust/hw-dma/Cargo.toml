[package]
name = "hw-dma"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rx-rt = { path = "../../../crates/rx-rt", features = ["critical-section", "executor"] }
hw-board = { path = "../hw-board" }
critical-section = "1.2"
embedded-hal = "1.0"
embassy-executor = "0.10"
# The board's HAL with its async DMA waits (the same crate hw-board takes).
rx72-hal = { path = "../../../crates/rx72-hal", optional = true }
rx74-hal = { path = "../../../crates/rx74-hal", optional = true }

[features]
# The board: exactly one of these (hw-board).
ap-rx72m = ["hw-board/ap-rx72m", "rx72-hal/async"]
ek-rx74n = ["hw-board/ek-rx74n", "rx74-hal/async"]
ek-rx74m = ["hw-board/ek-rx74m", "rx74-hal/async"]

[[bin]]
name = "hw-dma"
test = false
bench = false

[profile.release]
opt-level = "s"
debug = true

[profile.dev]
opt-level = 1

# The generated PACs are about 23 MB (RX72) and 47 MB (RX74) of source:
# with debug info rustc takes over ten minutes on them.
[profile.release.package.rx72-pac]
debug = false
[profile.dev.package.rx72-pac]
debug = false
opt-level = "s"
[profile.release.package.rx74-pac]
debug = false
[profile.dev.package.rx74-pac]
debug = false
opt-level = "s"
