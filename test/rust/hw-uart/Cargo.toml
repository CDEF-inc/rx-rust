[package]
name = "hw-uart"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rx-rt = { path = "../../../crates/rx-rt", features = ["critical-section"] }
hw-board = { path = "../hw-board" }
embedded-io = { git = "https://github.com/CDEF-inc/embedded-hal", rev = "41f29f6bfced1cae0cbe712ba96ee32c075b3125" }
embedded-hal = { git = "https://github.com/CDEF-inc/embedded-hal", rev = "41f29f6bfced1cae0cbe712ba96ee32c075b3125" }

[features]
# The board: exactly one of these (hw-board).
ap-rx72m = ["hw-board/ap-rx72m"]

[[bin]]
name = "hw-uart"
test = false
bench = false

[profile.release]
opt-level = "s"
debug = true

[profile.dev]
opt-level = 1

# The generated PAC is about 23 MB of source: with debug info rustc
# takes over ten minutes on it.
[profile.release.package.rx72-pac]
debug = false
[profile.dev.package.rx72-pac]
debug = false
opt-level = "s"
