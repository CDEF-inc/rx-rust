[build]
target = "rx-none-elf"

[target.rx-none-elf]
# QEMU models an RX62N: RXv1 with the single-precision FPU.
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "target-cpu=rxv1",
             "-C", "target-feature=+fpu"]

[unstable]
build-std = ["core"]
build-std-features = ["compiler-builtins-mem"]
